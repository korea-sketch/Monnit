
<div class="mk-terms-foot">
  <span>© 주식회사 모넷코리아</span>
  <button type="button" class="mk-terms-open" aria-haspopup="dialog">서비스 이용약관(SLA)</button>
  <a href="/privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
</div>
<dialog class="mk-terms-dlg" id="mkTermsDlg" aria-label="긴급 경보 알리미 서비스 이용약관">
  <div class="mk-terms-hd">
    <b>긴급 경보 알리미 서비스 이용약관(SLA)</b>
    <a href="/alarm/sla.pdf" download="모넷코리아_긴급경보알리미_SLA.pdf">PDF</a>
    <a href="/alarm/terms" target="_blank" rel="noopener">새 창</a>
    <button type="button" class="mk-terms-x" aria-label="닫기">×</button>
  </div>
  <iframe title="서비스 이용약관 전문" loading="lazy" data-src="/alarm/terms?embed=1"></iframe>
</dialog>
<style>
.mk-terms-foot{max-width:1080px;margin:0 auto;padding:18px 20px 26px;display:flex;flex-wrap:wrap;gap:4px 14px;
  font-size:11px;line-height:1.6;color:#9aa3a0;opacity:.85}
.mk-terms-foot a,.mk-terms-foot button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.mk-terms-foot a:hover,.mk-terms-foot button:hover{text-decoration:underline}
/* 쿠키 동의 바가 떠 있는 동안 맨 아래 줄이 가려지지 않게 */
body:has(#mnk-cc.show) .mk-terms-foot{padding-bottom:130px}
.mk-terms-dlg{width:min(860px,94vw);height:min(86vh,900px);padding:0;border:1px solid #c9d2cd;border-radius:6px;background:#fff;color:#0f1a16}
.mk-terms-dlg::backdrop{background:rgba(10,16,14,.55)}
.mk-terms-dlg[open]{display:flex;flex-direction:column}
.mk-terms-hd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #e1e7e3;font-size:14px}
.mk-terms-hd b{flex:1;font-weight:600}
.mk-terms-hd a{font-size:12px;color:#0b6b4f}
.mk-terms-x{font-size:22px;line-height:1;border:0;background:none;cursor:pointer;color:#41524b;padding:0 4px}
.mk-terms-dlg iframe{flex:1;width:100%;border:0}
</style>
<script>
(function(){
  var d = document.getElementById("mkTermsDlg"); if(!d) return;
  var f = d.querySelector("iframe");
  Array.prototype.forEach.call(document.querySelectorAll(".mk-terms-open"), function(btn){
    btn.addEventListener("click", function(){
      if(!f.src) f.src = f.dataset.src;
      if(d.showModal) d.showModal(); else window.open("/alarm/terms", "_blank");
    });
  });
  d.querySelector(".mk-terms-x").addEventListener("click", function(){ d.close(); });
  d.addEventListener("click", function(e){ if(e.target === d) d.close(); });
})();
</script>
