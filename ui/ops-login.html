<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><title>로그인</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
background:#0B1220;color:#E8EDF5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:300px}
h1{font-size:16px;font-weight:800;margin-bottom:18px;color:#8FA2BF;letter-spacing:1px}
input{width:100%;background:#141C2E;border:1px solid #233047;color:#E8EDF5;border-radius:10px;
padding:13px;font-size:16px;margin-bottom:9px;font-family:inherit}
button{width:100%;background:#4A9EFF;color:#04101F;border:none;border-radius:10px;padding:13px;
font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:5px}
.e{font-size:12.5px;color:#FF6B6B;margin-top:11px;min-height:17px;text-align:center}</style></head>
<body><form class="box" method="POST" action="/ops/login">
<h1>MONNIT</h1>
<input name="u" placeholder="아이디" autocomplete="username" autocapitalize="off" autocorrect="off" required>
<input name="p" type="password" placeholder="비밀번호" autocomplete="current-password" required>
<button type="submit">확인</button>
<div class="e">__ERR__</div>
</form></body></html>
