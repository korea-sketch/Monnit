<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구독 관리 · 긴급 경보 알리미 | 모넷코리아</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="/css/billing.css?v=4">
<style>
.tabs{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;margin-bottom:22px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;color:var(--text2)}
.tabs button.is-on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.login{max-width:460px;margin:0 auto;padding:40px 0}
.login h1{font-size:40px;letter-spacing:-.035em;margin:0 0 8px;line-height:1.1}
.login > p{color:var(--muted);margin:0 0 26px}
.login .field{margin-bottom:12px}
.subs{display:grid;gap:20px}
.sub{background:var(--card);border-radius:var(--r);border:1px solid var(--line2);box-shadow:var(--shadow);overflow:hidden}
.sub__head{display:flex;gap:16px;align-items:center;padding:22px 24px}
.sub__head img{width:54px;height:66px;object-fit:contain;flex:none}
.sub__head h2{margin:0;font-size:21px;letter-spacing:-.025em}
.sub__head p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;background:var(--fill);color:var(--text2);margin-left:auto;white-space:nowrap;align-self:flex-start}
.st.active{background:var(--green-soft);color:var(--green)} .st.past_due{background:var(--red-soft);color:var(--red)} .st.registered{background:var(--blue-soft);color:var(--blue)} .st.canceled{background:var(--fill);color:var(--faint)} .st.cancel{background:var(--amber-soft);color:var(--amber)}
.next{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:18px 24px;background:var(--fill);flex-wrap:wrap}
.next small{display:block;color:var(--muted);font-size:13px}
.next b{font-size:28px;letter-spacing:-.03em}
.next .when{font-size:15px;font-weight:600;text-align:right}
.sub__body{padding:6px 24px 22px}
.line{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);font-size:15px}
.line:last-child{border-bottom:0}
.line .k{color:var(--muted);width:120px;flex:none}
.line .v{flex:1;min-width:0}
.cardchip{display:inline-flex;align-items:center;gap:8px}
.cardchip i{width:30px;height:20px;border-radius:4px;background:linear-gradient(135deg,#3a3a3c,#1d1d1f);display:inline-block}
.pays{margin-top:6px}
.pays summary{cursor:pointer;color:var(--blue);font-size:15px;padding:14px 0 6px;list-style:none}
.pays summary::-webkit-details-marker{display:none}
.pay{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2);font-size:14px}
.pay:last-child{border-bottom:0}
.pay small{display:block;color:var(--muted);font-size:12px}
.pay .amt{font-weight:600;text-align:right}
.tag{font-size:12px;padding:2px 8px;border-radius:980px;background:var(--fill);color:var(--text2)}
.tag.paid{background:var(--green-soft);color:var(--green)} .tag.failed{background:var(--red-soft);color:var(--red)} .tag.canceled{background:var(--fill);color:var(--faint)}
.acts{display:flex;gap:10px;flex-wrap:wrap;padding-top:16px}
dialog{border:0;border-radius:var(--r);padding:28px;max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 8px;font-size:22px}
dialog p{color:var(--muted);font-size:15px;margin:0 0 16px}
.dash-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:44px 0 26px;flex-wrap:wrap}
.dash-top h1{margin:0;font-size:40px;letter-spacing:-.035em;line-height:1.1}
.dash-top p{margin:6px 0 0;color:var(--muted)}
@media (max-width:600px){.line .k{width:92px}.dash-top h1,.login h1{font-size:30px}.pay{grid-template-columns:1fr auto}.pay .rc{grid-column:1/-1}}
</style>
</head>
<body>
<header class="bar"><div class="bar__in">
  <a class="bar__logo" href="/promo/alarm"><img src="/logo.png" alt="Monnit"><span>구독 관리</span></a>
  <div class="bar__right"><span class="pill-test" id="testPill" hidden>테스트 모드</span><a href="/pay">새 구독 신청</a></div>
</div></header>

<main class="wrap">
  <div class="skeleton" id="loading">불러오는 중…</div>

  <section class="login" id="login" hidden>
    <h1>구독 관리</h1>
    <p>결제 내역 확인, 카드 변경, 해지를 할 수 있어요.</p>
    <div class="tabs" role="tablist"><button type="button" data-tab="member" class="is-on">회원 로그인</button><button type="button" data-tab="guest">비회원 조회</button></div>
    <div class="field" id="subField" hidden><input id="lgSub" placeholder=" " autocapitalize="characters"><label for="lgSub">구독번호 (예: SUB-261103-ABCDE)</label></div>
    <div class="field"><input id="lgEmail" type="email" placeholder=" " autocomplete="email" inputmode="email"><label for="lgEmail">이메일</label></div>
    <button class="btn btn--dark btn--block" id="lgSend" type="button">인증코드 받기</button>
    <div id="lgCodeBox" hidden><div class="otp-code" id="lgCode"></div><p class="note"><span><b id="lgTo"></b>로 보낸 6자리 코드를 입력해 주세요.</span></p></div>
    <div class="err" id="lgErr"></div>
    <p style="font-size:13px;color:var(--muted);margin-top:22px" id="lgHint">회원은 이메일 인증으로 로그인하며, 같은 이메일로 신청한 모든 구독이 보입니다.</p>
  </section>

  <section id="dash" hidden>
    <div class="dash-top"><div><h1>내 구독</h1><p id="dashWho"></p></div><button class="btn btn--line btn--sm" id="logout" type="button">로그아웃</button></div>
    <div class="subs" id="subs"></div>
  </section>
</main>

<dialog id="cancelDlg">
  <h3>구독을 해지할까요?</h3>
  <p id="cancelText"></p>
  <div class="field"><textarea id="cancelReason" placeholder=" "></textarea><label for="cancelReason">해지 사유 (선택)</label></div>
  <div class="acts" style="justify-content:flex-end"><button class="btn btn--line btn--sm" type="button" id="cancelNo">유지하기</button><button class="btn btn--sm" style="background:var(--red)" type="button" id="cancelYes">해지 신청</button></div>
</dialog>
<div class="toast" id="toast"></div>
<footer class="foot">상호 주식회사 모넷코리아 · 대표자 염정훈 · 사업자등록번호 242-88-01218 · 주소 서울특별시 서초구 효령로 380, 2층 · 대표전화 02-2088-1454 · 이메일 <a href="mailto:1015@monnit.com">1015@monnit.com</a><br><a href="/alarm/terms">이용약관</a> · <a href="/alarm/refund">결제·환불 정책</a> · <a href="/privacy.html">개인정보처리방침</a></footer>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const qs = new URLSearchParams(location.search);
const wonK = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dot = (d) => String(d || "").slice(0, 10).replace(/-/g, ".");
/* 이미지 파일 이름과 실제 그림이 엇갈려 있어(water=차단기함, outage=경광등, alarm=집수정) 그림 기준으로 맞춘다 */
const IMG = { fire: "/images/alarm/ta-plan-fire.webp", water: "/images/alarm/ta-plan-alarm.webp", power: "/images/alarm/ta-plan-water.webp", alarm: "/images/alarm/ta-plan-outage.webp" };
const SLOT = { am: "오전", pm: "오후", any: "시간 무관" };
function installLine(s) {
  const i = s.install; if (!i) return "";
  const d = (x) => x ? x.replace(/-/g, ".") : "";
  if (i.status === "done") return `${d(i.doneDate)} 설치 완료`;
  if (i.status === "confirmed") return `${d(i.date)} ${SLOT[i.slot] || ""} 확정 · 현장 사정에 따라 변동될 수 있어요`;
  return `희망 ${d(i.wish)}${i.alt ? ` · 2순위 ${d(i.alt)}` : ""} ${SLOT[i.slot] || ""} — 담당자 확정 전 (변동 가능)`;
}
const ST = { pending: "등록 대기", registered: "설치 대기", active: "이용 중", past_due: "결제 실패", canceled: "해지됨" };
const PAYST = { paid: "결제 완료", failed: "실패", canceled: "취소됨", partial_canceled: "부분 취소", invoice_pending: "세금계산서 발행 예정", issued: "세금계산서 발행 · 입금 대기", };
const ERR = { wrong_code: "인증코드가 맞지 않아요.", expired: "인증코드가 만료되었어요. 다시 받아 주세요.", too_soon: "잠시 후 다시 보내 주세요.", too_many: "요청이 많아요. 잠시 후 다시 시도해 주세요.", bad_email: "이메일 주소를 확인해 주세요.", too_many_tries: "입력 횟수를 넘었어요. 코드를 다시 받아 주세요.", mail_unavailable: "지금은 인증 메일을 보낼 수 없어요. 02-2088-1454로 연락해 주세요.", login_required: "다시 로그인해 주세요.", pg_not_ready: "카드 결제가 준비되지 않았어요." };
const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const inTerm = (s) => !!(s.term && s.term.to && today() <= s.term.to);
function monthsLeft(s) { if (!inTerm(s)) return 0; const a = today(), b = s.term.to; return Math.max(0, (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7)) - (+a.slice(5, 7)) + (+b.slice(8) >= +a.slice(8) ? 1 : 0)); }
ERR.in_term = "의무 사용기간 중에는 해지할 수 없어요. 만기 해지 예약이나 중도 해지 상담을 이용해 주세요.";
const errText = (j) => ERR[j && j.error] || (j && j.message) || "처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.";
async function api(path, body) {
  const r = await fetch("/api/billing/" + path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok && j.ok !== false) j = { ok: false, error: "server" };
  return j;
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("is-on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("is-on"), 3000); }
let CFG = {}, ME = null, TAB = "member", EMAIL = "";

init();
async function init() {
  [CFG, ME] = await Promise.all([api("config"), api("me")]);
  $("#testPill").hidden = !CFG.test;
  if (qs.get("card") === "ok" && qs.get("authKey")) {
    $("#loading").textContent = "카드를 바꾸고 있어요…";
    const j = await api("card/confirm", { subId: qs.get("sub"), authKey: qs.get("authKey"), customerKey: qs.get("customerKey") });
    history.replaceState(null, "", "/account");
    toast(j.ok ? (j.charged ? (j.charged.status === "paid" ? `카드를 바꾸고 밀린 ${wonK(j.charged.amount)}을 결제했어요.` : "카드는 바뀌었지만 결제가 실패했어요.") : "결제 카드를 바꿨어요.") : errText(j));
    ME = await api("me");
  } else if (qs.get("card") === "fail") { history.replaceState(null, "", "/account"); toast(qs.get("message") || "카드 변경을 취소했어요."); }
  if (ME && ME.subs && ME.subs.length) return dash();
  if (ME && ME.member) return dash();
  showLogin();
}

/* ── 로그인 ── */
function showLogin() {
  $("#loading").hidden = true; $("#dash").hidden = true; $("#login").hidden = false;
  if (qs.get("sub")) { setTab("guest"); $("#lgSub").value = qs.get("sub"); }
}
function setTab(t) {
  TAB = t; $$("[data-tab]").forEach((b) => b.classList.toggle("is-on", b.dataset.tab === t));
  $("#subField").hidden = t !== "guest"; $("#lgCodeBox").hidden = true; $("#lgErr").textContent = ""; $("#lgSend").textContent = "인증코드 받기";
  $("#lgHint").textContent = t === "guest" ? "신청 때 받은 메일에 구독번호가 있어요. 신청한 이메일로 인증코드를 보내 드립니다." : "회원은 이메일 인증으로 로그인하며, 같은 이메일로 신청한 모든 구독이 보입니다. 처음이면 자동으로 가입돼요.";
}
$$("[data-tab]").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("#lgSend").addEventListener("click", send);
async function send() {
  const email = $("#lgEmail").value.trim(), sub = $("#lgSub").value.trim().toUpperCase();
  $("#lgErr").textContent = "";
  if (TAB === "guest" && !/^SUB-\d{6}-[A-Z0-9]{5}$/.test(sub)) { $("#lgErr").textContent = "구독번호를 확인해 주세요."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) { $("#lgErr").textContent = ERR.bad_email; return; }
  const b = $("#lgSend"); b.disabled = true;
  const j = await api("otp/send", { email, purpose: TAB === "guest" ? "lookup" : "login", subId: sub });
  b.disabled = false;
  if (!j.ok) { $("#lgErr").textContent = errText(j); return; }
  EMAIL = email; $("#lgTo").textContent = email; $("#lgCodeBox").hidden = false; b.textContent = "다시 받기";
  const box = $("#lgCode");
  box.innerHTML = Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" autocomplete="${i ? "off" : "one-time-code"}" aria-label="${i + 1}번째 숫자">`).join("");
  const ins = $$("input", box);
  ins.forEach((el, i) => {
    el.addEventListener("input", () => {
      const v = el.value.replace(/\D/g, "");
      if (v.length > 1) v.split("").slice(0, 6 - i).forEach((c, k) => { ins[i + k].value = c; }); else el.value = v;
      (ins.find((x) => !x.value) || ins[5]).focus();
      if (ins.every((x) => x.value)) verify(ins.map((x) => x.value).join(""));
    });
    el.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !el.value && i) ins[i - 1].focus(); });
  });
  ins[0].focus();
  if (j.devCode) toast("개발용 인증코드: " + j.devCode);
}
async function verify(code) {
  const j = await api("otp/verify", { email: EMAIL, code });
  if (!j.ok) { $("#lgErr").textContent = errText(j); $$("#lgCode input").forEach((x) => (x.value = "")); $("#lgCode input").focus(); return; }
  ME = await api("me");
  if (j.scope === "sub" && !(ME.subs || []).length) { $("#lgErr").textContent = "구독번호와 이메일이 일치하는 구독을 찾지 못했어요."; return; }
  dash();
}
$("#logout").addEventListener("click", async () => { await api("logout", {}); ME = null; showLogin(); });

/* ── 내 구독 ── */
function dash() {
  $("#loading").hidden = true; $("#login").hidden = true; $("#dash").hidden = false;
  $("#dashWho").textContent = ME.member ? `${ME.member.email} · 회원` : `${ME.email || ""} · 비회원 조회`;
  const subs = ME.subs || [];
  $("#subs").innerHTML = subs.length ? subs.map(card).join("") : `<div class="card" style="text-align:center;padding:40px">아직 구독이 없어요.<div class="acts" style="justify-content:center"><a class="btn btn--dark" href="/pay">구독 신청하기</a></div></div>`;
  subs.forEach((s) => bind(s));
}
function card(s) {
  const p = s.plan, prod = (p.lines && p.lines[0] && p.lines[0].product) || "fire";
  const cancelPending = s.cancel && s.status !== "canceled";
  const stCls = cancelPending ? "cancel" : s.status;
  const consulting = s.consult && !s.consult.done && s.status !== "canceled";
  const stTxt = cancelPending ? (s.cancel.pendingStaff ? "해지 요청 접수" : s.cancel.atTermEnd ? `만기 해지 예약` : `해지 예정 ${dot(s.cancel.effective)}`) : consulting ? "해지 상담 요청됨" : ST[s.status] || s.status;
  let next = "";
  if (s.status === "canceled") next = `<div><small>상태</small><b>해지됨</b></div><div class="when">${s.paidThrough ? dot(s.paidThrough) + "까지 이용" : ""}</div>`;
  else if (s.status === "registered") next = `<div><small>첫 결제 예정 금액</small><b>${wonK(p.total + (p.installFee ? p.installFee + Math.floor(p.installFee * .1) : 0))}</b></div><div class="when">설치 완료·확정 뒤 결제<small>${s.payDay ? `매월 ${s.payDay}일 · ` : ""}월 ${wonK(p.total)}</small></div>`;
  else if (s.status === "past_due") next = `<div><small>결제가 필요해요</small><b style="color:var(--red)">${wonK(s.lastPay && s.lastPay.amount || p.total)}</b></div><div class="when">카드를 바꾸면 바로 결제돼요</div>`;
  else if (s.nextChargeAt) next = `<div><small>다음 결제</small><b>${wonK(p.total)}</b></div><div class="when">${dot(s.retryAt || s.nextChargeAt)}<small>${s.retryAt ? "재시도 예정" : "부가세 포함"}</small></div>`;
  else next = `<div><small>매월 결제 금액</small><b>${wonK(p.total)}</b></div><div class="when">${cancelPending ? dot(s.paidThrough) + "까지 이용" : ""}</div>`;
  const pm = s.method === "card"
    ? `<span class="cardchip"><i></i>${esc((s.card && s.card.company) || "카드")} ${s.card && s.card.last4 ? "•••• " + esc(s.card.last4) : ""}</span>`
    : "세금계산서 · 계좌이체";
  const canCard = s.method === "card" && s.status !== "canceled" && CFG.ready;
  const fresh = s.status === "registered" && !s.cycle, term = inTerm(s);
  const acts = [];
  if (s.status !== "canceled" && !cancelPending) {
    if (fresh || !term) acts.push(`<button class="btn btn--danger btn--sm" data-act="cancel">해지 신청</button>`);
    else { acts.push(`<button class="btn btn--line btn--sm" data-act="termend">만기 해지 예약</button>`); if (!consulting) acts.push(`<button class="btn btn--danger btn--sm" data-act="consult">중도 해지 상담</button>`); }
  }
  if (cancelPending && s.cancel.by === "customer" && !s.cancel.pendingStaff) acts.push(`<button class="btn btn--line btn--sm" data-act="undo">해지 예약 철회</button>`);
  if (consulting && !cancelPending) acts.push(`<button class="btn btn--line btn--sm" data-act="undo">상담 요청 취소</button>`);
  const termLine = s.term ? `${dot(s.term.from)} ~ ${dot(s.term.to)} · ${term ? `남은 ${monthsLeft(s)}개월 (기간 중 해지 불가)` : "만료 — 매월 자동 연장 · 언제든 해지 가능"}`
    : s.plan.source === "contract" && s.plan.to ? `${dot(s.plan.from)} ~ ${dot(s.plan.to)} (계약서 기준)` : s.plan.termMonths ? `설치 완료일부터 ${s.plan.termMonths}개월` : "";
  return `<article class="sub" data-id="${esc(s.id)}">
    <div class="sub__head"><img src="${IMG[prod]}" alt=""><div><h2>${esc(p.label)}</h2><p>${p.qty}개소 · ${esc(s.customer.site || "")}</p></div><span class="st ${stCls}">${esc(stTxt)}</span></div>
    <div class="next">${next}</div>
    <div class="sub__body">
      <div class="line"><span class="k">결제 수단</span><span class="v">${pm}</span>${canCard ? `<button class="btn btn--ghost btn--sm" data-act="card">변경</button>` : ""}</div>
      <div class="line"><span class="k">구독번호</span><span class="v">${esc(s.id)}</span></div>
      <div class="line"><span class="k">설치 주소</span><span class="v">${esc(s.customer.siteAddr)}</span></div>
      ${installLine(s) ? `<div class="line"><span class="k">설치 일정</span><span class="v">${esc(installLine(s))}</span></div>` : ""}
      ${s.startedAt ? `<div class="line"><span class="k">구독 시작 (설치 완료)</span><span class="v">${dot(s.startedAt)}${s.paidThrough ? ` · ${dot(s.paidThrough)}까지 결제됨` : ""}</span></div>` : ""}
      ${termLine ? `<div class="line"><span class="k">의무 사용기간</span><span class="v">${esc(termLine)}</span></div>` : ""}
      ${s.contractRef ? `<div class="line"><span class="k">계약번호</span><span class="v">${esc(s.contractRef)}</span></div>` : ""}
      <details class="pays" data-pays><summary>결제 내역 보기</summary><div class="pays__list">불러오는 중…</div></details>
      <div class="acts">${acts.join("")}<a class="btn btn--line btn--sm" href="tel:0220881454">담당자 연결</a></div>
    </div></article>`;
}
function bind(s) {
  const el = $(`.sub[data-id="${s.id}"]`);
  $("[data-pays]", el).addEventListener("toggle", async (e) => {
    if (!e.target.open || e.target.dataset.loaded) return;
    e.target.dataset.loaded = 1;
    const j = await api("pays?sub=" + encodeURIComponent(s.id));
    const list = $(".pays__list", el);
    if (!j.ok) { list.textContent = errText(j); return; }
    list.innerHTML = j.pays.length ? j.pays.map((p) => `<div class="pay"><div>${esc(p.cycle)}회차 · ${dot(p.period && p.period.from)} ~ ${dot(p.period && p.period.to)}<small>${dot(p.approvedAt || p.issueDate || p.createdAt)} · ${esc(p.orderId)}${p.error ? " · " + esc(p.error.message) : ""}</small></div>
      <span class="tag ${esc(p.status)}">${esc(PAYST[p.status] || p.status)}</span><div class="amt">${wonK(p.amount)}${p.receiptUrl ? `<small class="rc"><a href="${esc(p.receiptUrl)}" target="_blank" rel="noopener">매출전표</a></small>` : ""}</div></div>`).join("")
      : `<p style="color:var(--muted);font-size:14px">아직 결제 내역이 없어요.</p>`;
  });
  el.addEventListener("click", async (e) => {
    const a = e.target.closest("[data-act]"); if (!a) return;
    if (a.dataset.act === "card") return changeCard(s, a);
    if (["cancel", "termend", "consult"].includes(a.dataset.act)) return askCancel(s, a.dataset.act);
    if (a.dataset.act === "undo") { const j = await api("cancel", { subId: s.id, undo: true }); toast(j.ok ? "철회했어요. 계속 이용하실 수 있어요." : errText(j)); ME = await api("me"); dash(); }
  });
}
async function changeCard(s, btn) {
  btn.disabled = true;
  const j = await api("card/change", { subId: s.id });
  if (!j.ok) { btn.disabled = false; return toast(errText(j)); }
  try {
    if (!window.TossPayments) await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://js.tosspayments.com/v2/standard"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    await window.TossPayments(CFG.clientKey).payment({ customerKey: j.customerKey }).requestBillingAuth({ method: "CARD", successUrl: j.successUrl, failUrl: j.failUrl, customerEmail: j.customerEmail, customerName: j.customerName });
  } catch (e) { toast(e && e.code === "USER_CANCEL" ? "카드 변경을 취소했어요." : "카드 등록 화면을 열지 못했어요."); }
  btn.disabled = false;
}
let CANCEL = null, MODE = "cancel";
function askCancel(s, mode) {
  CANCEL = s; MODE = mode;
  const T = { cancel: ["구독을 해지할까요?", "해지 신청"], termend: ["만기에 맞춰 해지할까요?", "만기 해지 예약"], consult: ["중도 해지 상담을 요청할까요?", "상담 요청"] }[mode];
  $("#cancelDlg h3").textContent = T[0]; $("#cancelYes").textContent = T[1];
  $("#cancelText").textContent = mode === "termend"
    ? `의무 사용기간이 끝나는 ${dot(s.term.to)}까지 이용하시고, 그 다음 날부터 결제되지 않습니다. 그때까지의 월 이용료는 평소처럼 결제됩니다. 만기 전에는 언제든 철회할 수 있어요.`
    : mode === "consult"
    ? `의무 사용기간(${dot(s.term.to)}까지, 남은 ${monthsLeft(s)}개월) 중에는 해지할 수 없습니다. 폐업·이전 등 부득이한 사정이 있으면 사유를 남겨 주세요. 담당자가 연락드려 계약 조건(위약금 포함)을 안내드립니다.`
    : s.status === "registered" && !s.cycle ? "아직 서비스가 시작되지 않아 바로 해지되며 청구되는 금액이 없습니다."
    : `다음 결제일(${dot(s.nextChargeAt)})부터 결제되지 않고, ${dot(s.paidThrough)}까지 이용하실 수 있어요. 장비 회수 일정은 담당자가 안내드립니다.`;
  $("#cancelReason").value = "";
  $("#cancelReason").nextElementSibling.textContent = mode === "consult" ? "해지 사유 (필수)" : "사유 (선택)";
  $("#cancelYes").style.background = mode === "termend" ? "var(--btn)" : "var(--red)";
  $("#cancelDlg").showModal();
}
$("#cancelNo").addEventListener("click", () => $("#cancelDlg").close());
$("#cancelYes").addEventListener("click", async () => {
  if (MODE === "consult" && $("#cancelReason").value.trim().length < 2) { $("#cancelReason").focus(); return toast("사유를 적어 주세요."); }
  const b = $("#cancelYes"); b.disabled = true;
  const j = await api("cancel", { subId: CANCEL.id, reason: $("#cancelReason").value, mode: MODE === "cancel" ? undefined : MODE === "termend" ? "term_end" : "consult" });
  b.disabled = false; $("#cancelDlg").close();
  toast(j.ok ? (j.consult ? "상담 요청을 접수했어요. 담당자가 연락드릴게요." : j.atTermEnd ? "만기 해지가 예약되었어요." : "해지가 접수되었어요.") : errText(j));
  ME = await api("me"); dash();
});
})();
</script>
</body>
</html>
