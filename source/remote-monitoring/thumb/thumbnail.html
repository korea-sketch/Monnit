<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Pretendard.woff2) format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:var(--h);background:#070C17;font-family:P,sans-serif;color:#EEF3FB;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 82% 30%,rgba(30,99,240,.35),transparent 60%),radial-gradient(500px 400px at 10% 110%,rgba(43,179,255,.12),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(150,185,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(150,185,235,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(90deg,#000 0%,#000 55%,transparent 100%)}
.l{position:absolute;left:72px;top:var(--top);width:640px}
.eb{font-size:20px;font-weight:700;letter-spacing:.28em;color:#5AA9FF}
.eb:after{content:"";display:block;width:58px;height:3px;background:#3FA7FF;margin-top:10px}
.sub{margin-top:34px;font-size:30px;font-weight:600;color:#9FB0CA}
h1{margin-top:6px;font-size:68px;line-height:1.16;font-weight:400;letter-spacing:-.035em}
h1 b{display:block;font-weight:800;background:linear-gradient(180deg,#fff 15%,#A9CFFF 95%);-webkit-background-clip:text;color:transparent}
.chips{display:flex;gap:12px;margin-top:30px}
.chips span{font-size:21px;padding:10px 20px;border-radius:999px;border:1px solid rgba(150,185,235,.3);background:rgba(255,255,255,.05);color:#D9E3F2}
.ft{position:absolute;left:72px;bottom:var(--fb)}
.ft b{display:block;font-size:22px;letter-spacing:.04em}
.ft span{display:block;font-size:18px;color:#8E9BB3;margin-top:4px}
.r{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:520px}
.r img{width:100%;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%)}
.card{position:absolute;left:-30px;top:20px;width:330px;padding:14px 16px;border-radius:16px;background:rgba(245,247,252,.94);color:#121820;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);display:flex;gap:12px;align-items:flex-start}
.ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#FF5A6A,#E8233A);flex:none;display:grid;place-items:center}
.card small{font-size:13px;color:#667}
.card strong{display:block;font-size:19px;margin-top:1px}
.card p{font-size:14px;color:#3a4250;margin-top:2px}
.dot{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 8px rgba(255,79,97,.35),0 0 30px #FF4F61;background:#FF4F61}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="l"><div class="eb">REMOTE MONITORING</div>
<div class="sub">배선 공사 필요 없는 무선 IoT 솔루션</div>
<h1>여러 건물의 주요 설비를<b>원격으로 통합 관제</b></h1>
<div class="chips"><span>제어반 · 기계실</span><span>EPS실 · 수변전실</span><span>휴대폰 즉시 알림</span></div></div>
<div class="ft"><b>MONNIT KOREA</b><span>과열 · 화재 · 누수 · 정전 실시간 감지</span></div>
<div class="r"><img src="zones.jpg"><div class="card"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></div><div><small>긴급 알림 · 지금</small><strong>A동 EPS실</strong><p>마그네틱에서 과열이 감지되었습니다.</p></div></div><span class="dot" style="left:63%;top:55%"></span></div>
</body></html>
